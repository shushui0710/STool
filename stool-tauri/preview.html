<!--
  这是**界面预览**，不是真实运行：
  用的就是 stool-tauri/src/ 下的同一套 HTML/CSS/JS，只是把 window.__TAURI__ 换成了
  一个内存假后端（下面那个脚本块），于是不需要 WebView2 也能看到界面长什么样。
  真实运行请用 stool-tauri.exe。
-->

<div class="app">

<div class="toasts" id="toasts"></div>

<script>

(function () {
  const GAME = "D:\\Games\\示例游戏 - 汉化测试版";
  const OUT = GAME + "\\_extracted";

  // 假事件总线：对应 Rust 侧的 app.emit("op:progress", ...)
  const listeners = {};
  function emit(ev, payload) {
    (listeners[ev] || []).slice().forEach((cb) => {
      try {
        cb({ payload });
      } catch (_) {}
    });
  }

  // 假存档树（形状贴近 RPG Maker MV 存档）
  let SAVE = {
    gold: 12345,
    level: 27,
    exp: 8421,
    hp: 640,
    mp: 210,
    system: { saveCount: 14, frameCount: 992813, versionId: 8123122 },
    party: { _gold: 12345, _items: { 1: 12, 2: 3, 7: 1 }, _actors: [1, 2, 3, 5] },
    switches: { 1: true, 12: false, 43: true, 88: true },
    variables: { 1: 100, 2: 0, 3: 7, 12: 250, 44: 3 },
    player: { x: 23, y: 41, dir: 2 },
    map: { _mapId: 12, name: "旧校舍 3F" },
  };

  const kindOf = (v) =>
    typeof v === "string" ? "str" : typeof v === "number" ? "num" : typeof v === "boolean" ? "bool" : "other";
  const tyOf = (v) =>
    typeof v === "string" ? "文本" : typeof v === "number" ? "数值" : typeof v === "boolean" ? "布尔" : "";

  function flatten(node, prefix, out) {
    if (node === null || typeof node !== "object") return;
    for (const [k, v] of Object.entries(node)) {
      const p = prefix + "/" + k;
      out.push({
        path: p,
        key: k,
        value: typeof v === "string" ? v : typeof v === "object" ? JSON.stringify(v) : String(v),
        kind: kindOf(v),
        ty: tyOf(v) || "容器",
      });
      flatten(v, p, out);
    }
  }
  const allRows = () => {
    const out = [];
    flatten(SAVE, "", out);
    return out;
  };

  function setByPath(ptr, raw) {
    const parts = ptr.split("/").filter(Boolean);
    let node = SAVE;
    for (let i = 0; i < parts.length - 1; i++) node = node[parts[i]];
    const last = parts[parts.length - 1];
    let v = raw.trim();
    if (v === "true") v = true;
    else if (v === "false") v = false;
    else if (v !== "" && !isNaN(Number(v))) v = Number(v);
    if (node && typeof node === "object") node[last] = v;
    return allRows().find((r) => r.path === ptr) || null;
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---- 假素材目录：对应 Rust 侧 scan_media / read_media -------------------
  // 字段与真实 MediaRow 对齐（name/rel/path/kind/size/renderable），
  // 外加两个只给假后端用的私有字段（_color / _body / _enc）。
  const IMG = (name, rel, size, color, renderable = true) => ({
    name, rel, path: GAME + "\\" + rel, kind: "image", size, renderable, _color: color,
  });
  const AUD = (name, rel, size) => ({
    name, rel, path: GAME + "\\" + rel, kind: "audio", size, renderable: true,
  });
  const TXT = (name, rel, size, body, enc) => ({
    name, rel, path: GAME + "\\" + rel, kind: "text", size, renderable: true, _body: body, _enc: enc,
  });

  const KS_JP = [
    "*start",
    "【朔】",
    "　おはよう。今日もいい天気だね。",
    "【樹】",
    "　うん、ちょっと早起きしすぎたかな。",
    "【朔】",
    "　それじゃ、行こうか。",
    "",
    "*choice_01",
    "　放課後はどうする？",
  ].join("\n");

  const MEDIA = [
    IMG("bg_title.png", "www/img/titles/bg_title.png", "1.2 MB", "#2b6cb0"),
    IMG("cg_01_heroine.png", "www/img/pictures/cg_01_heroine.png", "2.4 MB", "#c05621"),
    IMG("cg_02_school.png", "www/img/pictures/cg_02_school.png", "1.9 MB", "#2f855a"),
    IMG("cg_03_night.png", "www/img/pictures/cg_03_night.png", "2.1 MB", "#4c51bf"),
    IMG("akari.png", "www/img/faces/akari.png", "96 KB", "#b83280"),

  // 预览用的图片：现场画一张 SVG 当素材，省得往 HTML 里塞几 MB base64
  function svgDataUrl(color, label) {
    const w = 640, h = 400;
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">` +
      `<rect width="${w}" height="${h}" fill="${color}"/>` +
      `<rect x="24" y="24" width="${w - 48}" height="${h - 48}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>` +
      `<text x="${w / 2}" y="${h / 2}" font-family="sans-serif" font-size="38" fill="#fff" text-anchor="middle" dominant-baseline="middle">${label}</text>` +
      `</svg>`;
    try {
      return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
    } catch (_) {
      return "data:image/svg+xml," + encodeURIComponent(svg);
    }
  }

  // 预览用的音频：一段 0.05 秒的静音 WAV，让 <audio> 控件是"能放"的正常样子
  function tinyWav() {
    const rate = 8000, samples = 400;
    const buf = new ArrayBuffer(44 + samples);
    const dv = new DataView(buf);
    const w = (o, s) => {
      for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i));
    };
    w(0, "RIFF"); dv.setUint32(4, 36 + samples, true); w(8, "WAVE");
    w(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, rate, true); dv.setUint32(28, rate, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
    w(36, "data"); dv.setUint32(40, samples, true);
    for (let i = 0; i < samples; i++) dv.setUint8(44 + i, 128);
    let bin = "";
    const u8 = new Uint8Array(buf);
    for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
    return "data:audio/wav;base64," + btoa(bin);
  }

  // 假表格统计：96 已翻 / 32 待翻，前几条给预览表填上具体内容
  const CSV_STATS = {
    exists: true,
    path: GAME + "\\_extracted\\text.csv",

    done: 96,

    sample: [
      { file: "scenario/scene01.ks", key: "*start", source: "【朔】おはよう。今日もいい天気だね。", target: "【朔】早上好。今天天气也不错呢。", done: true },
      { file: "scenario/scene01.ks", key: "*start", source: "【樹】うん、ちょっと早起きしすぎたかな。", target: "【树】嗯，可能是起得有点太早了。", done: true },
      { file: "scenario/scene01.ks", key: "*choice_01", source: "　放課後はどうする？", target: "　放学后做什么？", done: true },
      { file: "scenario/scene02.ks", key: "*night", source: "　静かな夜だった。", target: "", done: false },
      { file: "www/data/Map001.json", key: "message", source: "ここは旧校舎の三階だ。", target: "", done: false },

  // ⑥ 内存扫描会话的可变状态：扫描 → 再次扫描 → 写入会依次改它，

  let RUNTIME_SCAN = {

    pid: 0,

    ty_label: "",
    first_done: false,
    hits: 0,

          "Data/CommonEvents.rvdata2",

        ],

      {
        name: "高清材质",
        enabled: true,
        files: 7,
        overwritten: 7,
        file_list: [
          "Graphics/Pictures/title.png",
          "Graphics/Characters/hero.png",
          "Graphics/Characters/heroine.png",
        ],
      },
      {
        name: "跳过战斗动画",
        enabled: false,
        files: 1,
        overwritten: 1,
        file_list: ["Data/System.rvdata2"],
      },
    ],
    conflicts: CONFLICT_ROWS,
    store_dir: (GAME || "") + "\\stool_mods",
    conflict_count: CONFLICT_ROWS.length,
  };

  // ⑨ 工具箱：一份可变设置 + 体检/自检结果 + 日志尾部。
  let TOOLS = {
    output_dir: "D:\\Games\\_stool_out",
    tools: [
      { key: "wolfdec", label: "WolfDec.exe", hint: "解 Wolf RPG 的封包", path: "C:\\Users\\me\\.stool\\tools\\WolfDec.exe", downloadable: true },
      { key: "asset_ripper", label: "AssetRipper", hint: "解 Unity 的封包", path: "", downloadable: true },
      { key: "garbro", label: "GARbro", hint: "认不出格式时的兜底解包", path: "", downloadable: true },
      { key: "gdre_tools", label: "GDRE Tools", hint: "反编译 Godot 的脚本", path: "", downloadable: true },
      { key: "unrpyc", label: "unrpyc.py", hint: "反编译 Ren'Py 的脚本", path: "C:\\Users\\me\\.stool\\tools\\unrpyc.py", downloadable: true },
      { key: "python", label: "Python", hint: "上面两个脚本工具要用它来跑", path: "C:\\Python313\\python.exe", downloadable: false },
      { key: "proxy", label: "代理", hint: "下载工具时走它（形如 http://127.0.0.1:7890）", path: "http://127.0.0.1:7892", downloadable: false },
    ],

    mtl_model: "deepseek-chat",
    mtl_key_set: true,
    proxy: "http://127.0.0.1:7892",
    config_path: "C:\\Users\\me\\AppData\\Roaming\\stool\\config.json",
  };

  const HEALTH_OK = {
    summary: "体检完成：1 项提示，未发现阻断性问题。",
    ok: true,
    items: [
      { level: "ok", name: "写权限", detail: "游戏目录可写", fix: "" },
      { level: "ok", name: "路径长度", detail: "路径不含特殊字符，长度正常", fix: "" },
      { level: "warn", name: "游戏占用", detail: "游戏当前正在运行", fix: "改文件前先退出游戏，否则改动可能被覆盖。" },
    ],
    text: "✔ 写权限: 游戏目录可写\n✔ 路径长度: 路径不含特殊字符，长度正常\n⚠ 游戏占用: 游戏当前正在运行\n    修法: 改文件前先退出游戏，否则改动可能被覆盖。",
  };
  const HEALTH_BAD = {
    summary: "体检发现问题，见下（按「修法」处理即可）。",
    ok: false,
    items: [
      { level: "ok", name: "写权限", detail: "游戏目录可写", fix: "" },
      { level: "fail", name: "非 Unicode 程序语言", detail: "当前是「简体中文」，老日文游戏可能显示乱码", fix: "把「非 Unicode 程序语言」改成「日语(日本)」后重启电脑。" },
      { level: "warn", name: "日文字体", detail: "系统缺少日文字体，日文可能显示成方块", fix: "安装一个日文字体（如 Noto Sans JP）即可。" },
    ],
    text: "✔ 写权限: 游戏目录可写\n✘ 非 Unicode 程序语言: 当前是「简体中文」\n    修法: 改成「日语(日本)」后重启\n⚠ 日文字体: 系统缺少日文字体\n    修法: 安装 Noto Sans JP",
  };
  const SELFCHECK_ROWS = {
    summary: "自检通过：2 个封包往返一致。",
    ok: true,
    items: [
      { level: "ok", name: "data.xp3", detail: "解包→重打包→回读，逐条目一致", fix: "" },
      { level: "ok", name: "patch.xp3", detail: "解包→重打包→回读，逐条目一致", fix: "" },
    ],
    text: "✔ data.xp3: 一致\n✔ patch.xp3: 一致",
  };

  const LOG_LINES = [
    "[20:23:01] ▶ STool 启动（内核 0.6.4）",
    "[20:23:01] ✔ 配置载入完成",
    "[20:23:03] ▶ 检测游戏 D:\\Games\\示例游戏 - 汉化测试版",
    "[20:23:05] ✔ 识别为 KiriKiri（置信度 92%）",
    "[20:23:12] ▶ 取出素材 → D:\\Games\\_stool_out",
    "[20:23:41] ✔ 取出 1234 个文件",
    "[20:24:02] ▶ 文本提取 data.xp3",
    "[20:24:30] ✔ 提取台词 8421 条",
    "[20:25:10] ▶ 机翻（deepseek-chat，并发 2）",
    "[20:25:55] ⚠ 机翻第 128 条超时，重试中…",
    "[20:26:03] ✔ 机翻完成，共 8421 条",
    "[20:26:20] ▶ 回填 data.xp3",
    "[20:26:58] ✔ 回填完成，原文件已备份为 data.xp3.stool.bak",
  ];

  const MOCK = {
    app_info: { name: "STool", version: "预览", core_version: "假数据" },    log_line: null,
    // 预览时直接给一个游戏，省得每次先点一遍「选游戏」（真实运行下这两个是环境变量钩子）
    env_game_root: GAME,
    env_save_path: null,
    env_query: "",
    env_out_dir: OUT,
    pick_folder: GAME,
    detect_game: {
      root: GAME,
      engine_id: "rpgmaker_mv",
      engine_name: "RPG Maker MV",
      score: 92,
      level: "high",
      confidence: "高置信",
      confirmed: true,
      summary: "RPG Maker MV 游戏",
      verdict: "没问题，这个游戏 STool 能处理。下面是可以直接做的事。",
      notes: "",
      evidence: ["找到 www/data/System.json（MV 数据目录特征）", "找到 www/js/rpg_core.js（MV 运行时）", "找到 Game.exe + nw.js 结构"],
      capabilities: [
        { id: "extract", label: "资源解包" },
        { id: "text_extract", label: "文本提取" },
        { id: "text_inject", label: "JSON 注入汉化" },
        { id: "save", label: "存档编辑" },
        { id: "unlock", label: "解锁辅助" },
      ],
      alternatives: [{ name: "RPG Maker MZ", score: 38, confidence: "疑似（证据不足）" }],
      elapsed_ms: 41,
    },

    // 解包：真的走一遍「推进度 → 返回结果」，好让预览里能看见进度条在动
    extract_assets: async () => {
      const dirs = ["www/img/pictures/", "www/audio/bgm/", "www/data/", "www/js/", "www/img/faces/"];
      for (let i = 0; i < 42; i++) {
        emit("op:progress", {
          frac: (i + 1) / 45,
          msg: dirs[i % dirs.length] + "文件" + (i + 1) + ".png",
        });
        await sleep(45);
      }
      emit("op:progress", { frac: 1, msg: "完成" });
      return { success: true, message: "解包 1234 个文件", files_done: 1234, out_dir: OUT, logs: [] };
    },
    repack_assets: async () => {
      for (let i = 0; i < 20; i++) {
        emit("op:progress", { frac: (i + 1) / 22, msg: "写回 data/Map00" + i + ".json" });
        await sleep(45);
      }
      emit("op:progress", { frac: 1, msg: "完成" });
      return { success: true, message: "重新打包完成", files_done: 320, out_dir: "", logs: [] };
    },
    cancel_task: true,
    open_folder: null,

    // ③ 看素材：按 kind 过滤后返回；total = 该类型的命中数（与真实内核一致）
    scan_media: (a) => {
      const k = a.kind || "all";
      const pick = MEDIA.filter((m) => k === "all" || m.kind === k);
      const files = pick.map((m) => ({
        name: m.name, rel: m.rel, path: m.path,
        kind: m.kind, size: m.size, renderable: m.renderable,
      }));
      return { dir: a.dir, files, total: pick.length, elapsed_ms: 34 };
    },
    read_media: (a) => {
      const m = MEDIA.find((x) => x.path === a.path);
      if (!m) {
        return { kind: "other", mime: "", data_url: "", text: "", encoding: "", size: "", truncated: false };
      }
      if (m.kind === "image") {
        return {
          kind: "image", mime: "image/png", data_url: svgDataUrl(m._color, m.name),
          text: "", encoding: "", size: m.size, truncated: false,
        };
      }
      if (m.kind === "audio") {
        return {
          kind: "audio", mime: "audio/wav", data_url: tinyWav(),
          text: "", encoding: "", size: m.size, truncated: false,
        };
      }
      return {
        kind: "text", mime: "text/plain", data_url: "",
        text: m._body, encoding: m._enc, size: m.size, truncated: false,
      };
    },
    open_file: null,

    save_locations: [{ label: "游戏目录/save", path: GAME + "\\save" }],
    save_files: [
      { name: "file1.rpgsave", path: GAME + "\\save\\file1.rpgsave", size: "21.4 KB", age: "3 小时前" },
      { name: "file2.rpgsave", path: GAME + "\\save\\file2.rpgsave", size: "19.8 KB", age: "1 天前" },
      { name: "global.rpgsave", path: GAME + "\\save\\global.rpgsave", size: "2.1 KB", age: "1 天前" },
    ],
    load_save: {
      path: GAME + "\\save\\file1.rpgsave",
      format: "RPG Maker MV 存档（lz-string）",
      writable: true,
      top_fields: 8,
    },
    pick_and_load_save: null,
    search_save: (a) => {
      const q = String(a.query || "").toLowerCase();
      if (!q) return [];
      return allRows()
        .filter((r) =>
          a.scope === "keys"
            ? r.key.toLowerCase().includes(q)
            : a.scope === "values"
            ? r.value.toLowerCase().includes(q)
            : r.key.toLowerCase().includes(q) || r.value.toLowerCase().includes(q)
        )

<script src="src/js/pages/unlock.js"></script>
<script src="src/js/pages/mods.js"></script>
<script src="src/js/pages/tools.js"></script>
<script src="src/js/pages/soon.js"></script>
<script>
/* 预览专用：直接停在某一页看效果（真实运行没有这一段）。
   必须放在**所有页面脚本之后** —— 它要直接改 PreviewPage 的字段，
   放前面会因 PreviewPage 还没定义而静默失效（踩过一次）。

   例：preview.html#extract —— 直接看「取出素材」，并当作「已经选好游戏」。
   可选参数：
     ?theme=dark   深色版
     ?kind=image   看「看素材」时预选某个类型（all|image|audio|text）
     ?pick=3       看「看素材」时预选列表第几个文件（截文本预览用）
*/
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get("theme") === "dark") {
    try {
      localStorage.setItem("stool.theme", "dark");
    } catch (_) {}
  }
  const page = (location.hash || "").replace(/^#/, "");
  if (!page || page === "detect") return;
  if (window.__MOCK_DETECT__) {
    Store.gameRoot = window.__MOCK_DETECT__.root;
    Store.detect = window.__MOCK_DETECT__;
  }
  // ?nogame=1 —— 演「还没选游戏」。用来验各页空状态是否给得出路
  // （§2.2「任何页面没有死胡同」）。放在 setPage 之前才生效。
  if (q.get("nogame") === "1") {
    Store.gameRoot = null;
    Store.detect = null;
  }
  // 「看素材」：预置好类型筛选与选中的文件，这样截图时列表和右侧都是满的。
  if (page === "preview") {
    const k = q.get("kind");
    if (k) PreviewPage.kind = k;
    PreviewPage.dir = window.__MOCK_DETECT__.root + "\\_extracted";
    const pick = Number(q.get("pick"));
    if (Number.isFinite(pick)) window.__PV_PICK__ = pick;
  }
  // 「翻译文字」：预置好目录与表格，这样统计、预览表、注入状态都是满的。
  // 与「看素材」同理 —— 不预置的话截出来只有两个空输入框和一堆 0。
  if (page === "text") {
    TextPage.outDir = window.__MOCK_DETECT__.root + "\\_extracted";
    TextPage.csvPath = TextPage.outDir + "\\text.csv";
    TextPage.jsonPath = window.__MOCK_DETECT__.root + "\\stool_translate.json";
    TextPage.csv = {
      exists: true,
      path: TextPage.csvPath,
      total: 128,
      done: 96,
      todo: 32,
      sample: [],
    };
    // ?mtl=1：把机翻设置折叠块展开，方便看那一块的样子。
    // 它挂在 .fold 上（页面上第一个折叠块就是它），用 open 属性展开即可。
    if (q.get("mtl") === "1") {
      TextPage._openMtl = true;
    }
    // ?fold=1：展开「表格预览」，看 CSV 三列渲染效果。
    if (q.get("fold") === "1") {
      TextPage._openCsv = true;
    }
  }
  // ?autorun=1 时自动跑一次「取出素材」，好把进行中的进度条也看到
  // （假后端会按 45ms 一步推进度，配合 --virtual-time-budget 就能截到中途）。
  if (q.get("autorun") === "1") {
    setTimeout(() => {
      try {
        ExtractPage.run("extract");
      } catch (_) {}
    }, 80);
  }
  // 「解锁全CG」：预置勾选/展开状态，好把「确认写入」和备份列表也截到。
  //   ?apply=1      勾上「我确认要写入」（按钮变红、文案变「确认写入并解锁」）
  //   ?bak=1        展开备份列表
  //   ?run=1        直接跑一次写入（看进度条与结果卡）
  if (page === "unlock") {
    if (q.get("apply") === "1") UnlockPage.apply = true;
    // showBackups 必须在 mount() 之后设 —— mount 会把它重置为 false（每次进页面重采）。
    if (q.get("bak") === "1") {
      const orig = UnlockPage.mount.bind(UnlockPage);
      UnlockPage.mount = async function (h) {
        const r = await orig(h);
        this.showBackups = true;
        await this.render();
        return r;
      };
    }
    if (q.get("run") === "1") {
      UnlockPage.apply = q.get("apply") === "1";
      setTimeout(() => {
        try {
          UnlockPage.run();
        } catch (_) {}
      }, 120);
    }
  }

  // 「装MOD」辅助之外的通用延时器：备份/还原那几个 hook 都要等 mount 跑完。
  const later = (fn, ms) =>
    setTimeout(() => {
      try {
        fn();
      } catch (e) {
        console.log("hook 失败: " + e.message);
      }
    }, ms || 400);

  // 「改存档」：预置一份已打开的存档，好把编辑器、常用字段、搜索列表都截满。
  //   ?save=undo     演「刚写回一次」—— 写回卡片下面出现就地还原条
  //   ?save=bak      展开「备份与还原」并列出备份
  //   ?save=bakempty 同上，但目录里没有备份（验空状态给出路）
  //
  // 注意 GAME / OUT 都是上面那个脚本块里的 IIFE 局部变量，这里拿不到（坑⑩），
  // 只能经 window 上的假检测结果取根目录。
  if (page === "save") {
    const mode = q.get("save");
    if (mode) {
      const ROOT = window.__MOCK_DETECT__.root;
      later(async () => {
        await SavePage.loadSave(ROOT + "\\save\\file1.rpgsave");
        await SavePage.doSearch(mode === "undo" ? "gold" : "");
        if (mode === "undo") {
          // 内核的备份路径规则是「原路径 + .stool.bak」，这里照抄一份当作刚生成的那份。
          SavePage.lastBackup = ROOT + "\\save\\file1.rpgsave.stool.bak";
          SavePage.paintCommit();
        } else {
          if (mode === "bakempty") window.__MOCK_NO_BAK__ = true;
          for (const d of SavePage.root.querySelectorAll("details.fold")) {
            if (d.querySelector("#bkHost")) d.open = true;
          }
          const btn = SavePage.root.querySelector('#bkHost [data-bk="load"]');
          if (btn) btn.click();
        }
      });
    }
  }

  // 「取出素材」：
  //   ?repack=done 跑一遍「重新打包」，看写回结果卡 + 里面的还原入口
  //   ?repack=bak  只展开「进阶」里的备份列表（模拟「上次打包过、这次想退回」）
  if (page === "extract") {
    const mode = q.get("repack");
    if (mode) {
      const OUT = window.__MOCK_DETECT__.root + "\\_extracted";
      later(async () => {
        if (mode === "done") {
          ExtractPage.repackSrc = OUT;
          ExtractPage.repackAck = true;
          await ExtractPage.run("repack");
          // 「重新打包完成」卡片里那份备份列表也要列出来，否则截图里只有一个按钮。
          const btn = ExtractPage.root.querySelector('#bkGame [data-bk="load"]');
          if (btn) btn.click();
        } else {
          for (const d of ExtractPage.root.querySelectorAll("details.fold")) {
            if (d.querySelector("#bkGameFold")) d.open = true;
          }
          const btn = ExtractPage.root.querySelector('#bkGameFold [data-bk="load"]');
          if (btn) btn.click();
        }
      });
    }
  }

  // 「游戏里改数值」：预置两条链路的中间状态，好把各块都截满。
  //   ?scan=1   演一遍「选进程 → 首次扫描 → 再次扫描」（命中列表 + 只读提示）
  //   ?diag=1   演一遍保护诊断（回滚判定 / 方案清单）
  //   ?mv=1     方式一直接显示「已连接」的编辑器 + 变量一览
  if (page === "runtime") {
    // 注意：这些 hook 必须推迟到 mount 之后执行 —— mount 里会把 mvState/scan
    // 重置并根据后端返回值重画（与 unlock 的 ?bak=1 是同一个坑，见 pitfall ⑤）。
    // 用延时而不是包 mount()：包 mount 时后进的 render 会被 mount 内部的 render 覆盖。
    const later = (fn, ms) =>
      setTimeout(() => {
        try {
          fn();
        } catch (e) {
          console.log("runtime hook 失败: " + e.message);
        }
      }, ms || 300);

    // 方式一：mvState 不被 mount 重置（mount 只清 msg/err），所以直接预置即可 ——
    // 不需要定时器，也就不会和 --virtual-time-budget 抢时间。
    if (q.get("mv") === "1") {
      RuntimePage.mvState = window.__MOCK_RUNTIME__.mvmzState;
      RuntimePage.mvKind = "variable";
      RuntimePage.mvId = "12";
      RuntimePage.mvVal = "9999";
      RuntimePage.mvMsg = "已连上，开始改吧。";
    }
    if (q.get("scan") === "1") {
      later(async () => {
        RuntimePage.pid = 12345;
        RuntimePage.scanValue = "100";
        RuntimePage.riskAck = true;
        RuntimePage.showProcs = false;
        await RuntimePage.openScanner();
        await RuntimePage.scanRun(true);
        RuntimePage.scanValue = "137";
        RuntimePage.filter = "increased";
        await RuntimePage.scanRun(false);
      }, 500);
    }
    if (q.get("diag") === "1") {
      later(async () => {
        RuntimePage.pid = 12345;
        RuntimePage.scanValue = "100";
        RuntimePage.riskAck = true;
        await RuntimePage.openScanner();
        await RuntimePage.scanRun(true);
        RuntimePage.diagAddr = "0x0000000000F4A0000";
        await RuntimePage.diagRun();
        await RuntimePage.loadRegions();
      }, 500);
    }
    if (q.get("procs") === "1") {
      later(() => RuntimePage.loadProcs(), 500);
    }
  }

  // ⑧ 装MOD：?mods=pick 演「选好补丁目录 + 预演出冲突」；?mods=clean 演「没冲突的预演」。
  if (page === "mods") {
    const later = (fn, ms) =>
      setTimeout(() => {
        try {
          fn();
        } catch (e) {
          console.log("mods hook 失败: " + e.message);
        }
      }, ms || 300);
    const mode = q.get("mods");
    if (mode) {
      later(async () => {
        // MODS 是上面那个脚本块的 IIFE 局部变量，这里只能经 window 拿 —— 见坑⑩。
        const M = window.__MOCK_MODS__.state;
        if (mode === "empty") {
          // 「一个 MOD 都还没装」：验空状态给出的出路（§2.2「没有死胡同」）。
          // 没有已装 MOD 就不可能有冲突，所以冲突行一起清掉 —— 否则假后端自相矛盾。
          M.mods = [];
          M.conflicts = [];
          M.conflict_count = 0;
          ModsPage.srcDir = "";
          ModsPage.name = "";
          await ModsPage.loadState();
          await ModsPage.render();
          return;
        }
        if (mode === "clean") {
          // 「干净环境」演示：先清掉预置的冲突，再演一遍无冲突的预演
          M.mods = M.mods.map((m) => ({ ...m, enabled: m.name === "汉化补丁" }));
          M.conflicts = [];
          M.conflict_count = 0;
          ModsPage.srcDir = "D:\\下载\\新补丁";
          ModsPage.name = "新补丁";
        } else if (mode === "hits") {
          // 「会抢文件」演示：目录名带 conflict，假后端才返回冲突行
          ModsPage.srcDir = "D:\\下载\\汉化补丁_v2_conflict";
          ModsPage.name = "汉化补丁_v2";
        } else {
          ModsPage.srcDir = "D:\\下载\\汉化补丁_v2";
          ModsPage.name = "汉化补丁_v2";
        }
        ModsPage.previewing = true;
        await ModsPage.loadState();
        await ModsPage.runPreview();
        ModsPage.previewing = false;
        await ModsPage.render();
      }, 400);
    }
    // 折叠一个 MOD 的文件清单
    if (q.get("fold") === "1") {
      later(() => {
        ModsPage.open["汉化补丁"] = true;
        ModsPage.render();
      }, 400);
    }
  }

  if (page === "tools") {
    const later = (fn, ms) =>
      setTimeout(() => {
        try {
          fn();
        } catch (e) {
          console.log("tools hook 失败: " + e.message);
        }
      }, ms || 300);
    // 默认停诊断页；?tools=settings / ?tools=help 切到别的分区
    const mode = q.get("tools");
    later(async () => {
      if (mode === "settings") ToolsPage.tab = "settings";
      else if (mode === "help") ToolsPage.tab = "help";
      await ToolsPage.render();
    }, 400);
    // ?check=health / ?check=selfcheck 演一遍诊断结果
    const ck = q.get("check");
    if (ck) {
      if (ck === "bad" && window.__MOCK_TOOLS__) window.__MOCK_TOOLS__.health = "bad";
      later(async () => {
        ToolsPage.tab = "diag";
        // health 的「bad」分支由假后端按 __MOCK_TOOLS__ 决定，这里只负责触发
        await ToolsPage.runCheck(ck === "selfcheck" ? "selfcheck" : "health");
      }, 700);
    }
    // ?diag=1 演一遍「诊断包已导出」
    if (q.get("diag") === "1") {
      later(async () => {
        ToolsPage.tab = "diag";
        await ToolsPage.exportDiag();
      }, 700);
    }
  }
})();
</script>
<script src="src/js/app.js"></script>
</body>
</html>
